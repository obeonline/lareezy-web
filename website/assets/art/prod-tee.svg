<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <title>LaReezyana Tee</title>
  <defs>
    <filter id="ts" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#17100e" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="#fdecec"/>

  <g filter="url(#ts)">
    <!-- body -->
    <path d="M214 108 C214 108 246 96 300 96 C354 96 386 108 386 108
             L470 146 L506 258 L438 286 L430 500 L170 500 L162 286 L94 258 L130 146 Z"
          fill="#17100e" stroke="#17100e" stroke-width="6" stroke-linejoin="round"/>
    <!-- fabric shading -->
    <path d="M300 96 C354 96 386 108 386 108 L470 146 L506 258 L438 286 L430 500 L300 500 Z"
          fill="#ffffff" fill-opacity="0.07"/>
    <!-- collar -->
    <path d="M246 100 C262 130 338 130 354 100 C340 136 260 136 246 100 Z"
          fill="#f0a81e" stroke="#17100e" stroke-width="5" stroke-linejoin="round"/>
    <!-- seams -->
    <g stroke="#f7eedd" stroke-width="2" stroke-opacity="0.3" fill="none" stroke-dasharray="5 6">
      <path d="M174 494 H426"/>
      <path d="M166 288 L172 296"/>
      <path d="M434 288 L428 296"/>
    </g>
  </g>

  <!-- crest print, chest -->
  <g transform="translate(300 268) scale(0.66)">
    <path d="M100 14 L172 38 V104 C172 144 138 172 100 188 C62 172 28 144 28 104 V38 Z"
          transform="translate(-100 -100)" fill="#c8102e" stroke="#f0a81e" stroke-width="5" stroke-linejoin="round"/>
    <g transform="translate(0 -42)" fill="#f0a81e">
      <path d="M0 -18 C4 -11 4.5 -5 3 0 L-3 0 C-4.5 -5 -4 -11 0 -18 Z"/>
      <path d="M-3 0 C-11 -7 -19 -2 -15.5 5 C-13 10 -6.5 8.5 -2.5 3 Z"/>
      <path d="M3 0 C11 -7 19 -2 15.5 5 C13 10 6.5 8.5 2.5 3 Z"/>
      <rect x="-9" y="4.5" width="18" height="3.2" rx="1.4"/>
      <path d="M-2.2 8.5 h4.4 c0 5 1.4 7.5 3 9.5 h-10.4 c1.6 -2 3 -4.5 3 -9.5 Z"/>
    </g>
    <g transform="translate(0 8)">
      <path d="M-28 0 C-15 -17 15 -17 28 0 C15 17 -15 17 -28 0 Z" fill="#f7eedd" stroke="#17100e" stroke-width="4"/>
      <circle r="8.5" fill="#17100e"/>
    </g>
    <text x="0" y="126" text-anchor="middle" font-family="Georgia, serif" font-weight="700"
