<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <title>LaReezyana crest</title>
  <!-- Shield, fleur-de-lis, all-seeing eye and a UTH banner —
       the marks that run through the Skiddle Bandana artwork. -->
  <g>
    <!-- shield -->
    <path d="M100 14 L172 38 V104 C172 144 138 172 100 188 C62 172 28 144 28 104 V38 Z"
          fill="#c8102e" stroke="#17100e" stroke-width="5" stroke-linejoin="round"/>
    <path d="M100 26 L161 46 V104 C161 138 132 162 100 176 C68 162 39 138 39 104 V46 Z"
          fill="none" stroke="#f0a81e" stroke-width="3"/>

    <!-- fleur-de-lis, crowning -->
    <g fill="#f0a81e" transform="translate(100 60) scale(0.92)">
      <path d="M0 -18 C4 -11 4.5 -5 3 0 L-3 0 C-4.5 -5 -4 -11 0 -18 Z"/>
      <path d="M-3 0 C-11 -7 -19 -2 -15.5 5 C-13 10 -6.5 8.5 -2.5 3 Z"/>
      <path d="M3 0 C11 -7 19 -2 15.5 5 C13 10 6.5 8.5 2.5 3 Z"/>
      <rect x="-9" y="4.5" width="18" height="3.2" rx="1.4"/>
      <path d="M-2.2 8.5 h4.4 c0 5 1.4 7.5 3 9.5 h-10.4 c1.6 -2 3 -4.5 3 -9.5 Z"/>
    </g>

    <!-- eye -->
    <g transform="translate(100 108)">
      <path d="M-28 0 C-15 -17 15 -17 28 0 C15 17 -15 17 -28 0 Z"
            fill="#f7eedd" stroke="#17100e" stroke-width="4" stroke-linejoin="round"/>
      <circle r="8.5" fill="#17100e"/>
      <circle cx="3" cy="-3" r="2.6" fill="#f7eedd"/>
    </g>

    <!-- banner -->
    <g transform="translate(100 146)">
      <path d="M-52 -12 H52 L44 12 H-44 Z" fill="#f0a81e" stroke="#17100e" stroke-width="4" stroke-linejoin="round"/>
      <text x="0" y="6" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
            font-weight="700" font-size="20" letter-spacing="3" fill="#17100e">UTH</text>
    </g>

    <!-- rivets -->
    <g fill="#f0a81e">
      <circle cx="52" cy="52" r="3.4"/>
      <circle cx="148" cy="52" r="3.4"/>
    </g>
  </g>
</svg>
