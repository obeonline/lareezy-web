<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <title>Tour Hoodie</title>
  <defs>
    <filter id="hs" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#17100e" flood-opacity="0.26"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="#f0e7d5"/>

  <g filter="url(#hs)">
    <!-- hood, wider and lower so it sits behind the shoulders -->
    <path d="M204 206 C196 122 404 122 396 206 C378 230 222 230 204 206 Z"
          fill="#c8102e" stroke="#17100e" stroke-width="6" stroke-linejoin="round"/>

    <!-- body + sleeves -->
    <path d="M216 190 L118 226 L86 344 L154 366 L150 526 L450 526 L446 366 L514 344 L482 226 L384 190
             C364 224 236 224 216 190 Z"
          fill="#85081e" stroke="#17100e" stroke-width="6" stroke-linejoin="round"/>
    <path d="M300 210 L384 190 L482 226 L514 344 L446 366 L450 526 L300 526 Z" fill="#ffffff" fill-opacity="0.06"/>

    <!-- neck opening -->
    <path d="M224 198 C248 230 352 230 376 198" fill="none" stroke="#17100e" stroke-width="5"/>

    <!-- drawcords -->
    <g stroke="#f0a81e" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M272 220 C268 252 267 268 270 288"/>
      <path d="M328 220 C332 252 333 268 330 288"/>
    </g>
    <circle cx="270" cy="294" r="7" fill="#f0a81e"/>
    <circle cx="330" cy="294" r="7" fill="#f0a81e"/>

    <!-- kangaroo pocket -->
    <path d="M190 430 H410 L402 496 H198 Z" fill="none" stroke="#17100e" stroke-width="5" stroke-linejoin="round"/>
    <path d="M190 430 C208 448 230 454 256 454" fill="none" stroke="#17100e" stroke-width="4"/>
    <path d="M410 430 C392 448 370 454 344 454" fill="none" stroke="#17100e" stroke-width="4"/>

    <!-- ribbing -->
    <g stroke="#17100e" stroke-width="4" fill="none">
      <path d="M90 346 L154 366"/>
      <path d="M510 346 L446 366"/>
      <path d="M150 504 H450"/>
    </g>
  </g>

  <!-- tour print, kept well inside the chest panel -->
  <g transform="translate(300 330)" text-anchor="middle" font-family="Georgia, serif" fill="#f0a81e">
    <text y="-16" font-weight="700" font-size="26" letter-spacing="2">SKIDDLE</text>
    <text y="10" font-weight="700" font-size="26" letter-spacing="2">BANDANA</text>
    <text y="32" font-weight="700" font-size="11" letter-spacing="2.6">TOUR &#183; 2026</text>
    <g font-size="9.5" letter-spacing="1.1" fill="#fef6e0" fill-opacity="0.88">
      <text y="54">NEW YORK &#183; BOSTON &#183; ATLANTA</text>
      <text y="68">NEW ORLEANS &#183; DALLAS &#183; AUSTIN</text>
    </g>
  </g>
</svg>
