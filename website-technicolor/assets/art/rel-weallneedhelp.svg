<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <title>We All Need Help (2024)</title>
  <rect width="600" height="600" fill="#1b4d31"/>
  <rect x="22" y="22" width="556" height="556" fill="none" stroke="#f0a81e" stroke-width="3"/>

  <!-- two hands reaching, clasped -->
  <g transform="translate(300 292)" stroke="#f7eedd" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M-150 92 L-92 34 C-74 16 -50 16 -34 30"/>
    <path d="M-96 66 C-78 44 -56 40 -38 52"/>
    <path d="M-70 96 C-54 76 -34 70 -16 80"/>
    <path d="M150 -92 L92 -34 C74 -16 50 -16 34 -30"/>
    <path d="M96 -66 C78 -44 56 -40 38 -52"/>
    <path d="M70 -96 C54 -76 34 -70 16 -80"/>
  </g>
  <!-- the clasp -->
  <g transform="translate(300 292)">
    <circle r="46" fill="#c8102e" stroke="#f0a81e" stroke-width="6"/>
    <path d="M0 24 C-30 4 -26 -20 -12 -20 C-5 -20 -1 -15 0 -12 C1 -15 5 -20 12 -20 C26 -20 30 4 0 24 Z"
          fill="#f7eedd"/>
  </g>

  <g text-anchor="middle" font-family="Georgia, serif">
    <text x="300" y="98" font-weight="700" font-size="19" letter-spacing="7" fill="#f0a81e">LA REEZY</text>
    <text x="300" y="470" font-weight="700" font-size="52" letter-spacing="1" fill="#f7eedd">WE ALL</text>
    <text x="300" y="522" font-weight="700" font-size="52" letter-spacing="1" fill="#f0a81e">NEED HELP</text>
    <text x="300" y="556" font-size="13" letter-spacing="4" fill="#f7eedd" fill-opacity="0.75">2024</text>
  </g>
</svg>
