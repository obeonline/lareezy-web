<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <title>Free99$ (La Reezy LLC) (2025)</title>
  <defs>
    <pattern id="guil" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M0 13 C6.5 2 19.5 24 26 13" fill="none" stroke="#1b4d31" stroke-width="1.1" stroke-opacity="0.55"/>
      <path d="M13 0 C24 6.5 2 19.5 13 26" fill="none" stroke="#1b4d31" stroke-width="1.1" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <!-- banknote -->
  <rect width="600" height="600" fill="#e8f6ed"/>
  <rect width="600" height="600" fill="url(#guil)"/>
  <rect x="26" y="26" width="548" height="548" fill="none" stroke="#1b4d31" stroke-width="5"/>
  <rect x="42" y="42" width="516" height="516" fill="none" stroke="#1b4d31" stroke-width="2" stroke-dasharray="4 7"/>

  <!-- corner denominations -->
  <g font-family="Georgia, serif" font-weight="700" font-size="30" fill="#1b4d31">
    <text x="70" y="102">99</text>
    <text x="530" y="102" text-anchor="end">99</text>
    <text x="70" y="546">99</text>
    <text x="530" y="546" text-anchor="end">99</text>
  </g>

  <!-- portrait medallion -->
  <g transform="translate(300 268)">
    <ellipse rx="132" ry="150" fill="#f7eedd" stroke="#1b4d31" stroke-width="5"/>
    <ellipse rx="116" ry="134" fill="none" stroke="#1b4d31" stroke-width="2"/>
    <!-- crest instead of a president -->
    <g transform="translate(0 -16) scale(0.86)">
      <path d="M0 -92 L74 -66 V6 C74 48 40 78 0 96 C-40 78 -74 48 -74 6 V-66 Z"
            fill="#c8102e" stroke="#1b4d31" stroke-width="5" stroke-linejoin="round"/>
      <g transform="translate(0 -34)" fill="#f0a81e">
        <path d="M0 -18 C4 -11 4.5 -5 3 0 L-3 0 C-4.5 -5 -4 -11 0 -18 Z"/>
        <path d="M-3 0 C-11 -7 -19 -2 -15.5 5 C-13 10 -6.5 8.5 -2.5 3 Z"/>
        <path d="M3 0 C11 -7 19 -2 15.5 5 C13 10 6.5 8.5 2.5 3 Z"/>
        <rect x="-9" y="4.5" width="18" height="3.2" rx="1.4"/>
        <path d="M-2.2 8.5 h4.4 c0 5 1.4 7.5 3 9.5 h-10.4 c1.6 -2 3 -4.5 3 -9.5 Z"/>
      </g>
      <g transform="translate(0 26)">
        <path d="M-30 0 C-16 -18 16 -18 30 0 C16 18 -16 18 -30 0 Z" fill="#f7eedd" stroke="#17100e" stroke-width="4"/>
        <circle r="9" fill="#17100e"/>
      </g>
    </g>
    <text x="0" y="172" text-anchor="middle" font-family="Georgia, serif" font-weight="700"
          font-size="15" letter-spacing="3.5" fill="#1b4d31">LA REEZY LLC</text>
  </g>

  <g text-anchor="middle" font-family="Georgia, serif">
    <text x="300" y="480" font-weight="700" font-size="66" letter-spacing="1" fill="#1b4d31">FREE99$</text>
    <text x="300" y="512" font-weight="700" font-size="14" letter-spacing="5" fill="#c8102e">THIS ONE&#8217;S ON ME</text>
    <text x="300" y="72" font-weight="700" font-size="16" letter-spacing="6" fill="#1b4d31">LA REEZY &#183; 2025</text>
  </g>
</svg>
