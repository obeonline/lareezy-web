<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260">
  <title>Skiddle Technicolor confetti paisley repeat</title>
  <!-- Technicolor variant: the same seamless bandana print, but each motif
       carries its own colour instead of a single gold ink, so the ground
       reads as confetti. Geometry is untouched from the Red & Gold tile —
       motifs sit fully inside, edge and corner dots mirror across both
       axes — so the repeat stays exact and .sb-drift pans it seamlessly. -->
  <defs>
    <g id="boteh">
      <!-- teardrop with the classic inward curl -->
      <path d="M52 136 C16 118 2 84 16 54 C28 26 58 12 78 26 C96 39 96 68 80 78
               C68 86 50 82 47 70 C45 62 50 55 58 55 C52 66 62 74 72 68
               C84 60 84 42 72 34 C58 25 36 34 27 56 C15 84 26 114 52 136 Z"
            fill="#f0a81e" fill-opacity="0.16" stroke="#f0a81e" stroke-width="3.2" stroke-linejoin="round"/>
      <!-- inner echo -->
      <path d="M53 122 C28 106 20 82 30 58 C40 36 60 27 74 37"
            fill="none" stroke="#f0a81e" stroke-width="2" stroke-linecap="round" stroke-dasharray="1.5 7"/>
      <!-- seed dots along the belly -->
      <circle cx="40" cy="96" r="3.4" fill="#f0a81e"/>
      <circle cx="36" cy="76" r="2.6" fill="#f0a81e"/>
      <circle cx="39" cy="57" r="2.2" fill="#f0a81e"/>
      <circle cx="50" cy="42" r="2.6" fill="#f0a81e"/>
      <circle cx="66" cy="47" r="3.8" fill="#f0a81e" fill-opacity="0.65"/>
    </g>

    <g id="floret">
      <g fill="none" stroke="#45cddb" stroke-width="2.6" stroke-linecap="round">
        <path d="M0 -15 C7 -9 7 -3 0 0 C-7 -3 -7 -9 0 -15 Z"/>
        <path d="M0 -15 C7 -9 7 -3 0 0 C-7 -3 -7 -9 0 -15 Z" transform="rotate(60)"/>
        <path d="M0 -15 C7 -9 7 -3 0 0 C-7 -3 -7 -9 0 -15 Z" transform="rotate(120)"/>
        <path d="M0 -15 C7 -9 7 -3 0 0 C-7 -3 -7 -9 0 -15 Z" transform="rotate(180)"/>
        <path d="M0 -15 C7 -9 7 -3 0 0 C-7 -3 -7 -9 0 -15 Z" transform="rotate(240)"/>
        <path d="M0 -15 C7 -9 7 -3 0 0 C-7 -3 -7 -9 0 -15 Z" transform="rotate(300)"/>
      </g>
      <circle r="3.6" fill="#45cddb"/>
    </g>

    <!-- the eye motif that runs through the album artwork -->
    <g id="eye">
      <path d="M-19 0 C-10 -11 10 -11 19 0 C10 11 -10 11 -19 0 Z"
            fill="none" stroke="#f57ba6" stroke-width="2.8" stroke-linejoin="round"/>
      <circle r="4.6" fill="#f57ba6"/>
      <g stroke="#f57ba6" stroke-width="2" stroke-linecap="round">
        <path d="M0 -14 V-19"/><path d="M-12 -9 L-15 -13"/><path d="M12 -9 L15 -13"/>
      </g>
    </g>

    <!-- New Orleans -->
    <g id="fleur" fill="#55b685">
      <path d="M0 -18 C4 -11 4.5 -5 3 0 L-3 0 C-4.5 -5 -4 -11 0 -18 Z"/>
      <path d="M-3 0 C-11 -7 -19 -2 -15.5 5 C-13 10 -6.5 8.5 -2.5 3 Z"/>
      <path d="M3 0 C11 -7 19 -2 15.5 5 C13 10 6.5 8.5 2.5 3 Z"/>
      <rect x="-9" y="4.5" width="18" height="3.2" rx="1.4"/>
      <path d="M-2.2 8.5 h4.4 c0 5 1.4 7.5 3 9.5 h-10.4 c1.6 -2 3 -4.5 3 -9.5 Z"/>
    </g>

    <g id="corner-dots">
      <circle r="4.2" fill="#8a72e8"/>
      <circle cx="13" cy="13" r="2.2" fill="#8a72e8" fill-opacity="0.75"/>
      <circle cx="-13" cy="13" r="2.2" fill="#8a72e8" fill-opacity="0.75"/>
      <circle cx="13" cy="-13" r="2.2" fill="#8a72e8" fill-opacity="0.75"/>
      <circle cx="-13" cy="-13" r="2.2" fill="#8a72e8" fill-opacity="0.75"/>
    </g>
  </defs>

  <!-- two opposed botehs set the diagonal rhythm -->
  <use href="#boteh" transform="translate(18 26) scale(0.72)"/>
  <use href="#boteh" transform="translate(242 234) scale(0.72) rotate(180)"/>

  <!-- fillers -->
  <use href="#floret" transform="translate(196 52)"/>
  <use href="#floret" transform="translate(64 208)"/>
  <use href="#eye" transform="translate(130 130)"/>
  <use href="#fleur" transform="translate(214 146)"/>
  <use href="#fleur" transform="translate(46 114) rotate(180)"/>

  <!-- scattered seeds -->
  <g fill="#f0a81e" fill-opacity="0.8">
    <circle cx="156" cy="30" r="2.4" fill="#8a72e8"/>
    <circle cx="104" cy="60" r="2" fill="#45cddb"/>
    <circle cx="228" cy="98" r="2.4" fill="#f57ba6"/>
    <circle cx="176" cy="196" r="2" fill="#55b685"/>
    <circle cx="110" cy="230" r="2.4" fill="#fbefd8"/>
    <circle cx="26" cy="168" r="2" fill="#8a72e8"/>
    <circle cx="84" cy="148" r="2.4" fill="#f57ba6"/>
    <circle cx="196" cy="112" r="2" fill="#45cddb"/>
  </g>

  <!-- edge + corner accents, mirrored so the tile butts seamlessly -->
  <use href="#corner-dots" transform="translate(0 0)"/>
  <use href="#corner-dots" transform="translate(260 0)"/>
  <use href="#corner-dots" transform="translate(0 260)"/>
  <use href="#corner-dots" transform="translate(260 260)"/>
  <g fill="#f0a81e" fill-opacity="0.7">
    <circle cx="130" cy="0" r="3"/>
    <circle cx="130" cy="260" r="3"/>
    <circle cx="0" cy="130" r="3"/>
    <circle cx="260" cy="130" r="3"/>
  </g>
</svg>
